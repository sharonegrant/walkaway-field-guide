<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1017"/>
      <stop offset="0.58" stop-color="#131d26"/>
      <stop offset="1" stop-color="#08140e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16764b"/>
      <stop offset="1" stop-color="#0f4f35"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/></filter>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",Menlo,monospace}
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <image x="500" y="0" width="580" height="630" xlink:href="walkaway-hero-art.png" preserveAspectRatio="xMidYMid slice" opacity="0.18"/>
  <rect x="48" y="48" width="984" height="1254" rx="28" fill="none" stroke="#eef8f2" stroke-opacity="0.17" stroke-width="2"/>

  <g transform="translate(78 82)">
    <text class="mono" x="0" y="0" fill="#53e39b" font-size="18" font-weight="700" letter-spacing="3">05 · TWO PATHS FORWARD</text>
    <text class="sans" x="0" y="112" fill="#f8f3e9" font-size="82" font-weight="860" letter-spacing="-4">
      <tspan x="0" dy="0">Use the field guide.</tspan>
      <tspan x="0" dy="108">Or let us help.</tspan>
    </text>
    <text class="sans" x="0" y="332" fill="#b4c0cd" font-size="29">
      Technical readers and practical teams need different next steps.
    </text>
  </g>

  <g transform="translate(78 486)" filter="url(#shadow)">
    <rect width="438" height="510" rx="34" fill="#111a23" stroke="#364652" stroke-width="2"/>
    <rect x="28" y="28" width="154" height="42" rx="21" fill="#182730"/>
    <text class="mono" x="105" y="55" text-anchor="middle" fill="#9aabb8" font-size="15" font-weight="700" letter-spacing="2">BUILD IT</text>
    <text class="sans" x="30" y="145" fill="#f8f3e9" font-size="42" font-weight="820">
      <tspan x="30" dy="0">Read the</tspan>
      <tspan x="30" dy="52">technical guide.</tspan>
    </text>
    <text class="sans" x="30" y="270" fill="#aeb9c8" font-size="23">
      <tspan x="30" dy="0">Inspect the workflow,</tspan>
      <tspan x="30" dy="34">pilot evidence, failures,</tspan>
      <tspan x="30" dy="34">limits, and token model.</tspan>
    </text>
    <rect x="30" y="382" width="378" height="88" rx="20" fill="#0b1219" stroke="#53e39b"/>
    <text class="mono" x="50" y="407" fill="#7d8d9c" font-size="12" letter-spacing="2">GITHUB</text>
    <text class="sans" x="50" y="434" fill="#53e39b" font-size="18" font-weight="760">github.com/sharonegrant/</text>
    <text class="sans" x="50" y="458" fill="#53e39b" font-size="20" font-weight="800">walkaway-field-guide</text>
  </g>

  <g transform="translate(560 486)" filter="url(#shadow)">
    <rect width="442" height="510" rx="34" fill="url(#green)" stroke="#53e39b" stroke-width="2"/>
    <rect x="28" y="28" width="190" height="42" rx="21" fill="#0e3c29"/>
    <text class="mono" x="123" y="55" text-anchor="middle" fill="#d9f8e8" font-size="15" font-weight="700" letter-spacing="2">APPLY IT WITH US</text>
    <text class="sans" x="30" y="145" fill="#ffffff" font-size="42" font-weight="820">
      <tspan x="30" dy="0">Make AI useful</tspan>
      <tspan x="30" dy="52">in real work.</tspan>
    </text>
    <text class="sans" x="30" y="270" fill="#d6efe2" font-size="23">
      <tspan x="30" dy="0">Rick and Sharon help teams</tspan>
      <tspan x="30" dy="34">design practical AI, data,</tspan>
      <tspan x="30" dy="34">dashboard, and workflow systems.</tspan>
    </text>
    <rect x="30" y="382" width="382" height="88" rx="20" fill="#0d3927" stroke="#a2efc7"/>
    <text class="mono" x="50" y="416" fill="#b9e9ce" font-size="13" letter-spacing="2">EVERYDAY AI PLAYBOOK</text>
    <text class="sans" x="50" y="451" fill="#ffffff" font-size="25" font-weight="790">everydayaiplaybook.com</text>
  </g>

  <g transform="translate(78 1056)">
    <text class="mono" x="0" y="0" fill="#53e39b" font-size="16" font-weight="700" letter-spacing="3">START WITH THE WORK, NOT THE TOOL.</text>
    <text class="sans" x="0" y="60" fill="#f8f3e9" font-size="32" font-weight="710">
      <tspan x="0" dy="0">If information is scattered, follow-up is manual,</tspan>
      <tspan x="0" dy="42">or AI feels useful but unclear, start with an</tspan>
      <tspan x="0" dy="42">Everyday AI Readiness Audit.</tspan>
    </text>
  </g>

  <g transform="translate(78 1226)">
    <rect width="924" height="2" fill="#53e39b"/>
    <text class="mono" x="0" y="46" fill="#8f9ba8" font-size="15" letter-spacing="1.6">GUIDE = PUBLIC · PRODUCTION RUNNER = NOT YET PUBLISHED · CLAIMS STAY BOUNDED</text>
  </g>
</svg>
