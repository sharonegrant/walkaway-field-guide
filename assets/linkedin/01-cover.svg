<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#080d13" stop-opacity="0.99"/>
      <stop offset="0.46" stop-color="#0b1119" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0b1119" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53e39b"/>
      <stop offset="1" stop-color="#bdf7d9"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/></filter>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",Menlo,monospace}
    </style>
  </defs>
  <rect width="1080" height="1350" fill="#080d13"/>
  <image x="0" y="0" width="1080" height="1350" xlink:href="walkaway-hero-art.png" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#shade)"/>
  <rect x="56" y="56" width="968" height="1238" rx="38" fill="none" stroke="#d9f8e8" stroke-opacity="0.18" stroke-width="2"/>

  <g transform="translate(92 104)">
    <rect width="300" height="48" rx="24" fill="#10251d" stroke="#53e39b" stroke-opacity="0.75"/>
    <circle cx="28" cy="24" r="7" fill="#53e39b"/>
    <text class="mono" x="48" y="31" fill="#d8f9e8" font-size="17" font-weight="700" letter-spacing="2">BUILD IN PUBLIC</text>
  </g>

  <g transform="translate(92 288)" filter="url(#shadow)">
    <text class="sans" x="0" y="0" fill="#f7f2e8" font-size="108" font-weight="850" letter-spacing="-6">
      <tspan x="0" dy="0">I wanted AI</tspan>
      <tspan x="0" dy="112">to keep building</tspan>
      <tspan x="0" dy="112">after I walked</tspan>
      <tspan x="0" dy="112" fill="url(#accent)">away.</tspan>
    </text>
  </g>

  <g transform="translate(92 866)">
    <rect width="714" height="2" fill="#53e39b"/>
    <text class="sans" x="0" y="70" fill="#dce4ee" font-size="35" font-weight="600">
      <tspan x="0" dy="0">So I tested a bounded workflow</tspan>
      <tspan x="0" dy="50">with measured compute and</tspan>
      <tspan x="0" dy="50">independent verification.</tspan>
    </text>
  </g>

  <g transform="translate(92 1190)">
    <text class="mono" x="0" y="0" fill="#53e39b" font-size="21" font-weight="700" letter-spacing="2">THE WALKAWAY FIELD GUIDE</text>
    <text class="sans" x="0" y="46" fill="#aab5c5" font-size="24">Sharon Grant · July 2026</text>
    <circle cx="826" cy="16" r="28" fill="#53e39b"/>
    <path d="M812 16h28m-11-11 11 11-11 11" fill="none" stroke="#0b1119" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
