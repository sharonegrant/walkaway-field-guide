<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="0.56" stop-color="#111923"/>
      <stop offset="1" stop-color="#07100c"/>
    </linearGradient>
    <linearGradient id="artShade" x1="0" y1="0" x2="1" y2="0.82">
      <stop offset="0" stop-color="#0b1017" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#0b1017" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0b1017" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.42"/></filter>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",Menlo,monospace}
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <image x="452" y="88" width="628" height="780" xlink:href="walkaway-hero-art.png" preserveAspectRatio="xMidYMid slice" opacity="0.9"/>
  <rect x="0" y="0" width="1080" height="910" fill="url(#artShade)"/>
  <rect x="48" y="48" width="984" height="1254" rx="28" fill="none" stroke="#eef8f2" stroke-opacity="0.18" stroke-width="2"/>

  <g transform="translate(78 82)">
    <text class="sans" x="0" y="86" fill="#f8f3e9" font-size="112" font-weight="900" letter-spacing="-7">WALK<tspan fill="#53e39b">AWAY</tspan></text>
    <text class="mono" x="4" y="126" fill="#aeb9c8" font-size="17" font-weight="700" letter-spacing="4">A TESTED FIELD GUIDE FOR BOUNDED AI CODING RUNS</text>
    <g transform="translate(760 3)">
      <text class="mono" x="0" y="0" fill="#53e39b" font-size="16" font-weight="700" letter-spacing="2">FIELD REPORT 01</text>
      <text class="mono" x="0" y="30" fill="#8d9aaa" font-size="14" letter-spacing="2">JULY 2026</text>
    </g>
  </g>

  <g transform="translate(78 286)" filter="url(#shadow)">
    <text class="sans" x="0" y="0" fill="#f8f3e9" font-size="76" font-weight="850" letter-spacing="-4">
      <tspan x="0" dy="0">Can AI keep building</tspan>
      <tspan x="0" dy="98">after you walk away?</tspan>
    </text>
    <text class="sans" x="0" y="226" fill="#d7dfe8" font-size="29" font-weight="570">
      <tspan x="0" dy="0">I tested a workflow that plans, executes, and verifies</tspan>
      <tspan x="0" dy="43">code—without pushing, merging, or deploying it.</tspan>
    </text>
  </g>

  <g transform="translate(78 620)">
    <rect width="924" height="214" rx="30" fill="#111a23" fill-opacity="0.94" stroke="#344451" stroke-width="2"/>
    <g transform="translate(28 30)">
      <text class="mono" x="0" y="0" fill="#7f8c9c" font-size="15" letter-spacing="2">REAL CODEX TRIALS</text>
      <text class="sans" x="0" y="90" fill="#f8f3e9" font-size="72" font-weight="860">2/2</text>
      <text class="sans" x="0" y="137" fill="#aeb9c8" font-size="20">independently accepted</text>
    </g>
    <line x1="238" y1="30" x2="238" y2="184" stroke="#344451" stroke-width="2"/>
    <g transform="translate(270 30)">
      <text class="mono" x="0" y="0" fill="#7f8c9c" font-size="15" letter-spacing="2">CONTROL HARNESS</text>
      <text class="sans" x="0" y="90" fill="#53e39b" font-size="67" font-weight="860">35/35</text>
      <text class="sans" x="0" y="137" fill="#aeb9c8" font-size="20">checks passed</text>
    </g>
    <line x1="504" y1="30" x2="504" y2="184" stroke="#344451" stroke-width="2"/>
    <g transform="translate(536 30)">
      <text class="mono" x="0" y="0" fill="#7f8c9c" font-size="15" letter-spacing="2">MEAN USAGE</text>
      <text class="sans" x="0" y="90" fill="#f8f3e9" font-size="60" font-weight="860">63,125</text>
      <text class="sans" x="0" y="137" fill="#aeb9c8" font-size="20">token units</text>
    </g>
    <line x1="756" y1="30" x2="756" y2="184" stroke="#344451" stroke-width="2"/>
    <g transform="translate(788 30)">
      <text class="mono" x="0" y="0" fill="#7f8c9c" font-size="15" letter-spacing="2">VERIFY RESERVE</text>
      <text class="sans" x="0" y="90" fill="#53e39b" font-size="67" font-weight="860">25%</text>
      <text class="sans" x="0" y="137" fill="#aeb9c8" font-size="20">protected first</text>
    </g>
  </g>

  <g transform="translate(78 892)">
    <text class="mono" x="0" y="0" fill="#53e39b" font-size="16" font-weight="700" letter-spacing="3">THE CONTROLLED LOOP</text>
    <g transform="translate(0 42)">
      <rect width="260" height="132" rx="24" fill="#15201f" stroke="#53e39b"/>
      <circle cx="42" cy="42" r="20" fill="#53e39b"/>
      <text class="sans" x="42" y="50" text-anchor="middle" fill="#0b1117" font-size="21" font-weight="850">1</text>
      <text class="sans" x="78" y="47" fill="#f8f3e9" font-size="27" font-weight="760">PLAN</text>
      <text class="sans" x="24" y="96" fill="#aeb9c8" font-size="18">Bound scope + success</text>
    </g>
    <path d="M279 108h62m-18-15 18 15-18 15" fill="none" stroke="#ff8a5b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(362 42)">
      <rect width="260" height="132" rx="24" fill="#1c1d1d" stroke="#ff8a5b"/>
      <circle cx="42" cy="42" r="20" fill="#ff8a5b"/>
      <text class="sans" x="42" y="50" text-anchor="middle" fill="#111820" font-size="21" font-weight="850">2</text>
      <text class="sans" x="78" y="47" fill="#f8f3e9" font-size="27" font-weight="760">EXECUTE</text>
      <text class="sans" x="24" y="96" fill="#aeb9c8" font-size="18">Spend bounded budget</text>
    </g>
    <path d="M641 108h62m-18-15 18 15-18 15" fill="none" stroke="#53e39b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(724 42)">
      <rect width="200" height="132" rx="24" fill="#15201f" stroke="#53e39b"/>
      <circle cx="42" cy="42" r="20" fill="#53e39b"/>
      <text class="sans" x="42" y="50" text-anchor="middle" fill="#0b1117" font-size="21" font-weight="850">3</text>
      <text class="sans" x="78" y="47" fill="#f8f3e9" font-size="27" font-weight="760">VERIFY</text>
      <text class="sans" x="24" y="96" fill="#aeb9c8" font-size="18">Fresh agent checks</text>
    </g>
  </g>

  <g transform="translate(78 1140)">
    <rect width="924" height="74" rx="18" fill="#0d151b" stroke="#2f3d48"/>
    <circle cx="31" cy="37" r="8" fill="#ff8a5b"/>
    <text class="mono" x="54" y="43" fill="#e6ecef" font-size="17" font-weight="700" letter-spacing="1.5">NO PUSH · NO MERGE · NO DEPLOY · NO PRODUCTION DATA</text>
  </g>

  <g transform="translate(78 1260)">
    <text class="mono" x="0" y="0" fill="#8f9ba8" font-size="16" letter-spacing="2">SHARON GRANT · EVERYDAY AI PLAYBOOK</text>
    <text class="mono" x="924" y="0" text-anchor="end" fill="#53e39b" font-size="16" font-weight="700">BUILD IN PUBLIC</text>
  </g>
</svg>
