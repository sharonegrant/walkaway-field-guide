<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="0.55" stop-color="#121b25"/>
      <stop offset="1" stop-color="#08100d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#53e39b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#53e39b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.36"/></filter>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",Menlo,monospace}
    </style>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <circle cx="935" cy="110" r="180" fill="#53e39b" opacity="0.035"/>

  <g transform="translate(82 86)">
    <text class="mono" x="0" y="0" fill="#53e39b" font-size="19" font-weight="700" letter-spacing="3">02 · THE SYSTEM</text>
    <text class="sans" x="0" y="102" fill="#f7f2e8" font-size="72" font-weight="820" letter-spacing="-3">
      <tspan x="0" dy="0">Walkaway does not mean</tspan>
      <tspan x="0" dy="82" fill="#53e39b">“no oversight.”</tspan>
    </text>
    <text class="sans" x="0" y="286" fill="#aeb9c8" font-size="28">
      It means the oversight is designed into the run.
    </text>
  </g>

  <g transform="translate(82 472)" filter="url(#shadow)">
    <rect width="916" height="160" rx="32" fill="#151f2a" stroke="#2b3948" stroke-width="2"/>
    <circle cx="82" cy="80" r="38" fill="#53e39b"/>
    <text class="sans" x="82" y="92" text-anchor="middle" fill="#0b1118" font-size="32" font-weight="850">1</text>
    <text class="sans" x="150" y="65" fill="#f7f2e8" font-size="32" font-weight="760">PLAN</text>
    <text class="sans" x="150" y="106" fill="#aab5c5" font-size="22">Bound the task, authority, files, and success test.</text>
    <path d="M850 62v36m-18-18h36" stroke="#53e39b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(82 658)" filter="url(#shadow)">
    <rect width="916" height="160" rx="32" fill="#151f2a" stroke="#2b3948" stroke-width="2"/>
    <circle cx="82" cy="80" r="38" fill="#ff8a5b"/>
    <text class="sans" x="82" y="92" text-anchor="middle" fill="#111820" font-size="32" font-weight="850">2</text>
    <text class="sans" x="150" y="65" fill="#f7f2e8" font-size="32" font-weight="760">EXECUTE</text>
    <text class="sans" x="150" y="106" fill="#aab5c5" font-size="22">Spend only the execution budget inside isolation.</text>
    <path d="M838 80h42m-14-14 14 14-14 14" fill="none" stroke="#ff8a5b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(82 844)" filter="url(#shadow)">
    <rect width="916" height="160" rx="32" fill="#17251f" stroke="#53e39b" stroke-width="2"/>
    <circle cx="82" cy="80" r="38" fill="#53e39b"/>
    <text class="sans" x="82" y="92" text-anchor="middle" fill="#0b1118" font-size="32" font-weight="850">3</text>
    <text class="sans" x="150" y="65" fill="#f7f2e8" font-size="32" font-weight="760">VERIFY</text>
    <text class="sans" x="150" y="106" fill="#c5d3cc" font-size="22">A fresh agent checks evidence against the contract.</text>
    <circle cx="855" cy="80" r="31" fill="none" stroke="#53e39b" stroke-width="4"/>
    <path d="M840 80l10 10 20-23" fill="none" stroke="#53e39b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(82 1082)">
    <rect width="916" height="144" rx="28" fill="#0e171d" stroke="#34404c"/>
    <text class="mono" x="34" y="46" fill="#7f8c9d" font-size="17" letter-spacing="2">THE HUMAN STILL OWNS</text>
    <text class="sans" x="34" y="96" fill="#f7f2e8" font-size="27" font-weight="680">Scope · credentials · publication · irreversible actions</text>
  </g>
  <text class="mono" x="82" y="1297" fill="#708091" font-size="16">WALKAWAY FIELD GUIDE · SHARON GRANT</text>
</svg>
